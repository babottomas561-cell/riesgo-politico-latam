[project]
name = "riesgo-politico-latam"
version = "0.1.0"
description = "Event study: cuánto del castigo a los activos argentinos en 2026 viene de Argentina, de Brasil y del mundo."
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "tabulate>=0.10.0",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = ["pytest>=9.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::pandas.errors.Pandas4Warning"]
